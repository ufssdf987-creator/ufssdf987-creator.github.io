<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 · 이안이아빠 생활 계산기</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
         font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         background: #f4f7fb; color: #0f172a; }
  .box { max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.02em; }
  p { margin: 0 0 20px; color: #5b6b82; font-size: 14px; line-height: 1.7; }
  a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #2563eb;
      color: #fff; font-weight: 700; text-decoration: none; }
  @media (prefers-color-scheme: dark) {
    body { background: #0a1220; color: #eaf1f9; } p { color: #94a6bd; }
  }
</style>
</head>
<body>
  <div class="box">
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나 없는 페이지입니다. 계산기 모음에서 다시 골라 주세요.</p>
    <a href="./">계산기 모음으로</a>
  </div>
</body>
</html>
